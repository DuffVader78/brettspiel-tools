<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f13">
<title>DIE Spielesammlung</title>
<style>
  :root{
    --bg:#0d0f13; --bg2:#151922; --card:#1c2230; --card2:#232b3d;
    --line:#2c3547; --ink:#f2f5fa; --mut:#9aa7bd; --mut2:#6b7791;
    --red:#e23b3b; --red2:#ff5a4d; --amber:#f5a623; --green:#3ecf8e;
    --shadow:0 8px 30px rgba(0,0,0,.45); --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 500px at 50% -200px,rgba(226,59,59,.12),transparent 60%),var(--bg);
    color:var(--ink);min-height:100vh;padding:0 0 70px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header{text-align:center;padding:26px 16px 6px;position:relative}
  .flag{
    height:10px;width:100%;max-width:820px;margin:0 auto 18px;border-radius:4px;
    background-image:
      linear-gradient(45deg,#141821 25%,transparent 25%,transparent 75%,#141821 75%,#141821),
      linear-gradient(45deg,#141821 25%,#e9edf5 25%,#e9edf5 75%,#141821 75%,#141821);
    background-size:20px 20px;background-position:0 0,10px 10px;opacity:.55;
  }
  .back{position:absolute;left:16px;top:24px;color:var(--mut);text-decoration:none;font-size:14px}
  h1{margin:0;font-size:26px;letter-spacing:3px;font-weight:800}
  h1 .hl{color:var(--red2)}
  .sub{color:var(--mut);font-size:13px;margin-top:4px;letter-spacing:.5px}

  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px;box-shadow:var(--shadow)}
  label.fld{display:block;font-size:11.5px;color:var(--mut);margin:0 0 6px;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
  input[type=search],select{
    width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    padding:12px;border-radius:10px;font-size:16px;outline:none;font-family:inherit;
  }
  input:focus,select:focus{border-color:var(--red2)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{
    padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);
    color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .pill.on{background:linear-gradient(180deg,var(--red),#b52a2a);border-color:var(--red);color:#fff}
  .pill small{opacity:.7;margin-left:3px;font-weight:500}
  .row2{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
  .count{color:var(--mut);font-size:13px}
  .count b{color:var(--ink)}
  .mini{padding:9px 12px;font-size:13px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-weight:600;font-family:inherit}
  .mini.on{border-color:var(--amber);color:var(--amber)}

  button.act{
    width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:800;
    letter-spacing:.5px;cursor:pointer;color:#fff;margin-top:14px;font-family:inherit;
    background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 6px 20px rgba(226,59,59,.4);
  }
  button.act:active{transform:scale(.98)}

  .list{margin-top:6px}
  .game{
    background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:var(--r);padding:14px 16px;margin-top:12px;position:relative;
  }
  .game.pick{border-color:var(--red2);box-shadow:0 0 0 2px rgba(255,90,77,.35),var(--shadow);animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .ghead{display:flex;gap:10px;align-items:flex-start}
  .gname{flex:1;min-width:0}
  .gname b{font-size:17px;display:block;line-height:1.25}
  .exp{color:var(--amber);font-size:12.5px;margin-top:3px}
  .star{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mut2);padding:0 2px}
  .star.on{color:var(--amber)}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px;color:var(--ink)}
  .meta span{white-space:nowrap}
  .typ{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--mut)}
  .dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:2px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--red2)}
  .desc{color:var(--mut);font-size:14px;line-height:1.5;margin-top:8px}
  .foot2{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mut2)}
  .foot2 a{color:var(--mut);text-decoration:none;white-space:nowrap}
  .foot2 a:hover{color:var(--red2)}
  .empty{text-align:center;color:var(--mut);padding:30px 10px}
  .saved{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
  .saved input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:10px;font-size:16px;outline:none;font-family:inherit}
  .saved input:focus{border-color:var(--red2)}
  .hint{font-size:12.5px;color:var(--mut);margin-top:6px;min-height:1em}
  #print{display:none}
  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff!important;color:#000;padding:0}
    .flag,header,.wrap{display:none!important}
    #print{display:block;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000}
    #print h2{font-size:20px;margin:0 0 2px}
    #print .pmeta{font-size:11px;color:#444;margin-bottom:10px}
    #print table{width:100%;border-collapse:collapse;font-size:10.5px}
    #print th{text-align:left;border-bottom:1.5px solid #000;padding:4px 5px;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px}
    #print td{border-bottom:.5px solid #bbb;padding:4px 5px;vertical-align:top}
    #print tr{break-inside:avoid}
    #print td.n b{font-size:11.5px}
    #print .e{color:#555;font-size:9.5px}
    #print .num{white-space:nowrap}
  }
  .totop{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;
    border:1px solid var(--line);background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;font-size:22px;font-weight:800;
    box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;z-index:20}
  .totop.show{opacity:1;pointer-events:auto;transform:none}
  @media print{.totop{display:none!important}}
  .foot{text-align:center;color:var(--mut2);font-size:11.5px;margin-top:30px;line-height:1.6}
</style>
</head>
<body>
<div class="flag"></div>
<header>
  <a class="back" href="index.html">‹ Tools</a>
  <h1>📚 <span class="hl">DIE</span> SPIELESAMMLUNG</h1>
  <div class="sub" id="sub">Alle Spiele im Regal</div>
</header>

<div class="wrap">
  <div class="box">
    <label class="fld" for="q">Suche</label>
    <input type="search" id="q" placeholder="Name, Mechanik, Erweiterung …" autocomplete="off">
    <div style="margin-top:12px">
      <label class="fld">Wie viele seid ihr?</label>
      <div class="pills" id="pl"></div>
    </div>
    <div class="grid">
      <div><label class="fld" for="dmin">Dauer von</label>
        <select id="dmin"><option value="">egal</option><option value="15">15 Min</option><option value="30">30 Min</option><option value="45">45 Min</option><option value="60">1 Std</option><option value="90">1,5 Std</option><option value="120">2 Std</option><option value="180">3 Std</option></select></div>
      <div><label class="fld" for="dmax">Dauer bis</label>
        <select id="dmax"><option value="">egal</option><option value="15">15 Min</option><option value="30">30 Min</option><option value="45">45 Min</option><option value="60">1 Std</option><option value="90">1,5 Std</option><option value="120">2 Std</option><option value="180">3 Std</option></select></div>
      <div style="grid-column:1/-1"><label class="fld" for="cx">Komplexität</label>
        <select id="cx"><option value="">egal</option><option value="1">● leicht</option><option value="2">●● mittel</option><option value="3">●●● anspruchsvoll</option></select></div>
      <div style="grid-column:1/-1"><label class="fld" for="so">Sortieren</label>
        <div style="display:flex;gap:6px"><select id="so" style="min-width:0;padding:12px 8px"><option value="name">Name</option><option value="tmax">Dauer</option><option value="pmax">Spielerzahl</option><option value="cx">Komplexität</option></select><button class="mini" id="dir" type="button" title="Reihenfolge umdrehen" style="min-width:50px;padding:9px 8px">A–Z</button></div></div>
    </div>
    <div style="margin-top:12px">
      <label class="fld">Wem gehört's?</label>
      <div class="pills" id="ow"></div>
    </div>
    <div style="margin-top:12px">
      <label class="fld">Art</label>
      <div class="pills" id="ty"></div>
    </div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <label class="fld" for="sv">Gespeicherte Auswahlen</label>
      <div class="saved">
        <select id="sv"><option value="">– Auswahl laden –</option></select>
        <button class="mini" id="svdel" type="button" title="Gewählte Auswahl löschen">🗑</button>
        <input type="text" id="svname" placeholder="Name, z. B. „Spieleabend zu viert“" maxlength="40" autocomplete="off">
        <button class="mini" id="svsave" type="button">💾 Speichern</button>
      </div>
      <div class="hint" id="svhint"></div>
    </div>
    <div class="row2">
      <div class="count" id="count"></div>
      <div style="display:flex;gap:8px">
        <button class="mini" id="fav" type="button">★ Favoriten</button>
        <button class="mini" id="reset" type="button">Zurücksetzen</button>
      </div>
    </div>
  </div>

  <button class="act" id="rnd" type="button">🎲 Was spielen wir heute?</button>
  <button class="act sec" id="pdf" type="button" style="background:var(--card2);border:1px solid var(--line);box-shadow:none;font-size:15px;padding:12px;margin-top:10px">📄 Auswahl als PDF / drucken</button>
  <div id="pick"></div>
  <div class="list" id="list"></div>

  <div class="foot">
    Daten: unsere Sammlungen, Eckdaten laut BoardGameGeek · Favoriten und gespeicherte Auswahlen bleiben lokal auf deinem Gerät<br>
    Neues Spiel? In <code>spiele-daten.js</code> eine Zeile ergänzen und den Besitzer eintragen.
  </div>
</div>

<button class="totop" id="totop" type="button" aria-label="Nach oben zu Suche und Filtern">↑</button>
<div id="print"></div>
<script src="spiele-daten.js"></script>
<script>
const G=(window.SPIELE||[]).map((g,i)=>({...g,i}));
const $=s=>document.querySelector(s);
const LS='spiele_favs_v1';
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem(LS)||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem(LS,JSON.stringify([...favs]))}catch(e){}};
const st={q:'',pl:0,dmin:'',dmax:'',cx:'',so:'name',dir:1,ty:new Set(),ow:'',fav:false};
const owners=g=>String(g.besitzer||'').split(',').map(x=>x.trim()).filter(Boolean);
const fk=g=>g.name+'|'+(g.besitzer||'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rng=(a,b,u='')=>a==null?'–':(a===b||b==null?a+u:a+'–'+b+u);
const tm=(a,b)=>a==null?'–':rng(a,b,' Min');
const CXN=['leicht','mittel','anspruchsvoll'];

$('#sub').textContent=`${G.length} Spiele im Regal`;
$('#pl').innerHTML=['egal',1,2,3,4,5,6,'7+'].map((v,i)=>`<button class="pill${i===0?' on':''}" type="button" data-v="${i===0?0:i===7?7:v}">${v}</button>`).join('');
const typen=[...new Set(G.map(g=>g.typ))].sort((a,b)=>a.localeCompare(b,'de'));
function renderOw(){const all=[...new Set(G.flatMap(owners))].sort((a,b)=>a.localeCompare(b,'de'));$('#ow').innerHTML=[`<button class="pill${st.ow?'':' on'}" type="button" data-o="">Alle</button>`].concat(all.map(o=>`<button class="pill${st.ow===o?' on':''}" type="button" data-o="${esc(o)}">${esc(o)}<small>${G.filter(g=>owners(g).includes(o)).length}</small></button>`)).join('')}
function renderTy(){$('#ty').innerHTML=typen.map(t=>`<button class="pill${st.ty.has(t)?' on':''}" type="button" data-t="${esc(t)}">${esc(t)}<small>${G.filter(g=>g.typ===t).length}</small></button>`).join('')}

function filtered(){
  const q=st.q.trim().toLowerCase();
  return G.filter(g=>{
    if(q&&!(g.name+' '+g.exp+' '+g.mech+' '+g.desc+' '+g.typ+' '+(g.besitzer||'')).toLowerCase().includes(q))return false;
    if(st.ow&&!owners(g).includes(st.ow))return false;
    if(st.pl){if(g.pmin==null)return false;if(st.pl===7?g.pmax<7:(st.pl<g.pmin||st.pl>g.pmax))return false}
    if(st.dmin||st.dmax){if(g.tmin==null)return false;
      if(st.dmin&&g.tmax<+st.dmin)return false;
      if(st.dmax&&g.tmin>+st.dmax)return false;}
    if(st.cx&&g.cx!==+st.cx)return false;
    if(st.ty.size&&!st.ty.has(g.typ))return false;
    if(st.fav&&!favs.has(fk(g)))return false;
    return true;
  }).sort((a,b)=>{
    const k=st.so;if(k==='name')return a.name.localeCompare(b.name,'de')*st.dir;
    const x=a[k],y=b[k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x-y)*st.dir||a.name.localeCompare(b.name,'de');
  });
}
function card(g,pick){
  const dots=g.cx?`<span class="dots" title="${CXN[g.cx-1]}">${[1,2,3].map(n=>`<i class="${n<=g.cx?'on':''}"></i>`).join('')}</span>`:'–';
  return `<div class="game${pick?' pick':''}">
    <div class="ghead">
      <div class="gname"><b>${esc(g.name)}</b>${g.exp?`<div class="exp">+ ${esc(g.exp)}</div>`:''}</div>
      <button class="star${favs.has(fk(g))?' on':''}" type="button" data-f="${g.i}" aria-label="Favorit">${favs.has(fk(g))?'★':'☆'}</button>
    </div>
    <div class="meta">
      <span class="typ">${esc(g.typ)}</span>
      <span>👥 ${rng(g.pmin,g.pmax)}</span>
      <span>⏱ ${tm(g.tmin,g.tmax)}</span>
      <span>🎂 ${g.age==null?'–':g.age+'+'}</span>
      <span>${dots}</span>
      ${g.besitzer?`<span>🏠 ${esc(g.besitzer)}</span>`:''}
    </div>
    ${g.desc?`<div class="desc">${esc(g.desc)}</div>`:''}
    <div class="foot2"><span>${esc(g.mech||'')}</span>${g.bgg?`<a href="https://boardgamegeek.com/boardgame/${g.bgg}" target="_blank" rel="noopener">BGG ›</a>`:''}</div>
  </div>`;
}
function render(){
  const rows=filtered();
  $('#count').innerHTML=`<b>${rows.length}</b> von ${G.length} Spielen`;
  $('#list').innerHTML=rows.length?rows.map(g=>card(g)).join(''):`<div class="empty">Kein Spiel passt zu diesen Filtern.<br>Lockere Spielerzahl oder Dauer.</div>`;
  $('#fav').classList.toggle('on',st.fav);
  $('#dir').textContent=st.so==='name'?(st.dir>0?'A–Z':'Z–A'):(st.dir>0?'↑':'↓');
  $('#dir').title=st.dir>0?'aufsteigend – tippen zum Umdrehen':'absteigend – tippen zum Umdrehen';
}
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
['dmin','dmax','cx'].forEach(id=>$('#'+id).addEventListener('change',e=>{st[id]=e.target.value;
  if(st.dmin&&st.dmax&&+st.dmin>+st.dmax){const o=id==='dmin'?'dmax':'dmin';st[o]=st[id];$('#'+o).value=st[id]}render()}));
$('#so').addEventListener('change',e=>{st.so=e.target.value;st.dir=1;render()});
$('#dir').addEventListener('click',()=>{st.dir=-st.dir;render()});
const tt=$('#totop');
addEventListener('scroll',()=>tt.classList.toggle('show',scrollY>500),{passive:true});
tt.addEventListener('click',()=>{const m=matchMedia('(prefers-reduced-motion: reduce)').matches;scrollTo({top:0,behavior:m?'auto':'smooth'})});
$('#pl').addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;st.pl=+b.dataset.v;document.querySelectorAll('#pl .pill').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#ty').addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;const t=b.dataset.t;st.ty.has(t)?st.ty.delete(t):st.ty.add(t);renderTy();render()});
$('#ow').addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;st.ow=b.dataset.o;renderOw();render()});
$('#fav').addEventListener('click',()=>{st.fav=!st.fav;render()});
function applyState(o){
  Object.assign(st,{q:o.q||'',pl:+o.pl||0,dmin:o.dmin||'',dmax:o.dmax||o.du||'',cx:o.cx||'',so:o.so||'name',dir:o.dir===-1?-1:1,ty:new Set(o.ty||[]),ow:o.ow||'',fav:!!o.fav});
  $('#q').value=st.q;$('#dmin').value=st.dmin;$('#dmax').value=st.dmax;$('#cx').value=st.cx;$('#so').value=st.so;
  document.querySelectorAll('#pl .pill').forEach(x=>x.classList.toggle('on',+x.dataset.v===st.pl));
  $('#pick').innerHTML='';renderOw();renderTy();render();
}
$('#reset').addEventListener('click',()=>{applyState({});$('#sv').value=''});

// Gespeicherte Auswahlen
const LSV='spiele_auswahlen_v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(LSV)||'{}')}catch(e){}
const persist=()=>{try{localStorage.setItem(LSV,JSON.stringify(saved))}catch(e){}};
const snap=()=>({q:st.q,pl:st.pl,dmin:st.dmin,dmax:st.dmax,cx:st.cx,so:st.so,dir:st.dir,ty:[...st.ty],ow:st.ow,fav:st.fav});
const hint=t=>{$('#svhint').textContent=t};
function renderSaved(sel){const ks=Object.keys(saved).sort((a,b)=>a.localeCompare(b,'de'));
  $('#sv').innerHTML='<option value="">'+(ks.length?'– Auswahl laden –':'Noch keine gespeichert')+'</option>'+ks.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');
  if(sel)$('#sv').value=sel;}
$('#sv').addEventListener('change',e=>{const k=e.target.value;if(!k)return;applyState(saved[k]);$('#svname').value=k;hint(`„${k}“ geladen.`)});
$('#svsave').addEventListener('click',()=>{const k=$('#svname').value.trim();
  if(!k){hint('Gib der Auswahl zuerst einen Namen.');$('#svname').focus();return}
  const neu=!saved[k];saved[k]=snap();persist();renderSaved(k);hint(neu?`„${k}“ gespeichert.`:`„${k}“ überschrieben.`)});
$('#svname').addEventListener('keydown',e=>{if(e.key==='Enter')$('#svsave').click()});
let delArm='';
$('#svdel').addEventListener('click',()=>{const k=$('#sv').value;
  if(!k){hint('Wähle zuerst eine gespeicherte Auswahl.');return}
  if(delArm!==k){delArm=k;hint(`Nochmal auf 🗑 tippen, um „${k}“ zu löschen.`);return}
  delete saved[k];persist();delArm='';renderSaved();$('#svname').value='';hint(`„${k}“ gelöscht.`)});

// PDF / Drucken
function summary(){const p=[];
  if(st.pl)p.push(st.pl===7?'7+ Spieler':st.pl+' Spieler');
  const fm=v=>v>=60?(v/60+'').replace('.',',')+' Std':v+' Min';
  if(st.dmin&&st.dmax)p.push('Dauer '+fm(+st.dmin)+' bis '+fm(+st.dmax));else if(st.dmin)p.push('mind. '+fm(+st.dmin));else if(st.dmax)p.push('bis '+fm(+st.dmax));
  if(st.cx)p.push(CXN[st.cx-1]);
  if(st.ow)p.push('Besitzer: '+st.ow);
  if(st.ty.size)p.push([...st.ty].join(', '));
  if(st.fav)p.push('nur Favoriten');
  if(st.q.trim())p.push('Suche „'+st.q.trim()+'“');
  return p.length?p.join(' · '):'alle Spiele';}
$('#pdf').addEventListener('click',()=>{
  const rows=filtered();const name=$('#sv').value;
  const d=new Date().toLocaleDateString('de-DE');
  $('#print').innerHTML=`<h2>DIE Spielesammlung${name?' – '+esc(name):''}</h2>
  <div class="pmeta">${esc(summary())} · ${rows.length} Spiele · Stand ${d}</div>
  <table><thead><tr><th>Spiel</th><th>Art</th><th>Spieler</th><th>Dauer</th><th>Alter</th><th>Kompl.</th><th>Besitzer</th></tr></thead><tbody>
  ${rows.map(g=>`<tr><td class="n"><b>${esc(g.name)}</b>${g.exp?`<div class="e">+ ${esc(g.exp)}</div>`:''}${g.desc?`<div class="e">${esc(g.desc)}</div>`:''}</td><td>${esc(g.typ)}</td><td class="num">${rng(g.pmin,g.pmax)}</td><td class="num">${tm(g.tmin,g.tmax)}</td><td class="num">${g.age==null?'–':g.age+'+'}</td><td>${g.cx?CXN[g.cx-1]:'–'}</td><td>${esc(g.besitzer||'')}</td></tr>`).join('')}
  </tbody></table>`;
  window.print();
});
renderSaved();
document.addEventListener('click',e=>{const b=e.target.closest('.star');if(!b)return;const g=G[+b.dataset.f];favs.has(fk(g))?favs.delete(fk(g)):favs.add(fk(g));saveFavs();render();if($('#pick').dataset.i==g.i)$('#pick').innerHTML=card(g,true)});
$('#rnd').addEventListener('click',()=>{
  const rows=filtered();
  if(!rows.length){$('#pick').innerHTML=`<div class="empty">Mit diesen Filtern gibt es nichts zu losen.</div>`;return}
  const g=rows[Math.floor(Math.random()*rows.length)];
  $('#pick').dataset.i=g.i;$('#pick').innerHTML=card(g,true);
});
renderOw();renderTy();render();
</script>
</body>
