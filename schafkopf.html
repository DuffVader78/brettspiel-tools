<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f13">
<title>SCHAFKOPF · Zähltafel</title>
<style>
  :root{
    --bg:#0d0f13; --bg2:#151922; --card:#1c2230; --card2:#232b3d;
    --line:#2c3547; --ink:#f2f5fa; --mut:#9aa7bd; --mut2:#6b7791;
    --acc:#3ecf8e; --acc2:#5fe0a6; --gold:#f5c542; --red:#e23b3b; --red2:#ff5a4d; --blue:#4aa8ff; --purple:#9b7dff;
    --shadow:0 8px 30px rgba(0,0,0,.45); --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 500px at 50% -200px,rgba(62,207,142,.13),transparent 60%),var(--bg);
    color:var(--ink);min-height:100vh;padding:0 0 40px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 12px}
  header{text-align:center;padding:20px 16px 6px}
  h1{margin:0;font-size:24px;letter-spacing:3px;font-weight:800}
  h1 .hl{color:var(--acc2)}
  .sub{color:var(--mut);font-size:12.5px;margin-top:3px}

  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:var(--shadow)}
  .sectionTitle{font-size:11.5px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-weight:800;margin:16px 0 8px}
  .sectionTitle.first{margin-top:0}
  label.fld{display:block;font-size:11.5px;color:var(--mut);margin:0 0 5px;letter-spacing:.4px;text-transform:uppercase}
  select,input[type=text],input[type=number]{
    width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    padding:11px;border-radius:10px;font-size:16px;outline:none;
  }
  select:focus,input:focus{border-color:var(--acc)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:120px}
  .hint{font-size:12px;color:var(--mut2);margin-top:8px;line-height:1.5}

  button.act{
    width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:800;letter-spacing:.3px;
    cursor:pointer;color:#0b1a12;margin-top:12px;background:linear-gradient(180deg,var(--acc2),#2aa86f);
    box-shadow:0 6px 20px rgba(62,207,142,.3);transition:transform .08s;
  }
  button.act:active{transform:scale(.98)}
  button.act:disabled{opacity:.4;box-shadow:none;cursor:default}
  button.act.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:14px;padding:11px}
  button.act.danger{background:var(--card2);color:var(--red2);border:1px solid var(--line);box-shadow:none;font-size:14px;padding:11px}
  .mini{padding:8px 11px;font-size:12.5px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-weight:600}

  /* Segmente / Chips */
  .seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg2)}
  .seg button{flex:1;padding:11px 6px;border:none;background:transparent;color:var(--mut);font-weight:700;font-size:14px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#0b1a12}
  .seg.red button.on{background:var(--red);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;cursor:pointer;
    border:1.5px solid var(--line);background:var(--bg2);font-size:13.5px;font-weight:600;color:var(--mut);user-select:none;
  }
  .chip.on{color:var(--ink);border-color:var(--acc);background:rgba(62,207,142,.1)}
  .chip.on::after{content:"✓";color:var(--acc);font-weight:800;font-size:12px}
  .chip.dis{opacity:.35;pointer-events:none}
  .radio .chip.on::after{content:"●";font-size:10px}
  .prow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .prow .idx{flex:0 0 30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--mut)}
  .prow input.nm{flex:1;min-width:0}
  .prow input.st{flex:0 0 96px}
  .vrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .vrow:first-of-type{border-top:none}
  .vrow .nm{flex:1;font-weight:600;font-size:14.5px}
  .vrow input{flex:0 0 96px;text-align:right}
  .vrow .unit{color:var(--mut2);font-size:12px}

  /* Zähltafel */
  .sheet{position:relative;margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);overflow:hidden;box-shadow:var(--shadow)}
  .sheet .scroller{max-height:46vh;overflow:auto}
  table.tf{border-collapse:separate;border-spacing:0;width:100%;min-width:100%;table-layout:fixed}
  table.tf th,table.tf td{padding:6px 4px;text-align:center;font-size:12.5px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.tf th{position:sticky;background:var(--card2);z-index:3}
  table.tf thead tr:first-child th{top:0;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);height:34px}
  table.tf thead tr:nth-child(2) th{top:34px;font-size:15px;font-weight:800;height:38px;border-bottom:2px solid var(--acc);background:var(--card)}
  table.tf th.game,table.tf td.game{text-align:left;padding-left:8px;width:24%}
  table.tf th.stock,table.tf td.stock{width:16%;color:var(--gold)}
  table.tf td.game .t{font-weight:800;font-size:12.5px;display:block}
  table.tf td.game .s{font-size:10px;color:var(--mut2);display:block;white-space:normal;line-height:1.2}
  table.tf td .n{color:var(--mut2)}
  .pos{color:var(--acc2);font-weight:700} .neg{color:var(--red2);font-weight:700} .zero{color:var(--mut2)}
  table.tf td.play{background:rgba(62,207,142,.07);box-shadow:inset 0 -2px 0 var(--acc)}
  table.tf td.play.lost{background:rgba(226,59,59,.07);box-shadow:inset 0 -2px 0 var(--red)}
  table.tf tr.rw{cursor:pointer}
  table.tf tr.rw:active td{background:rgba(255,255,255,.04)}
  table.tf tr.editing td{outline:1px solid var(--gold);outline-offset:-1px}
  .startv{font-size:10px;color:var(--mut2);font-weight:500;display:block;line-height:1}

  /* Eingabe-Karte */
  .drow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
  .drow:first-child{border-top:none}
  .drow .nm{flex:1;font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dk{display:flex;gap:6px;align-items:center}
  .dk button{
    min-width:44px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);color:var(--mut);
    font-weight:800;font-size:14px;cursor:pointer;padding:0 8px;
  }
  .dk button.on{background:rgba(245,197,66,.15);border-color:var(--gold);color:var(--gold)}
  .dk button.kon{background:rgba(226,59,59,.14);border-color:var(--red2);color:var(--red2)}
  .dk button.small{min-width:30px;font-size:16px;color:var(--mut2)}
  .preview{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
  .preview .val{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
  .preview .val b{font-size:19px;color:var(--gold)}
  .preview .who{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px}
  .preview .calc{font-size:11px;color:var(--mut2);margin-top:4px}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:12px;background:rgba(245,197,66,.15);color:var(--gold);margin-left:6px;vertical-align:middle}
  .badge.p{background:rgba(155,125,255,.16);color:var(--purple)}
  .foot{text-align:center;color:var(--mut2);font-size:11px;margin-top:20px}

  /* ---- Bericht ---- */
  .report{padding-bottom:20px}
  .rhead{margin-top:10px;padding:16px;border-radius:var(--r);background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line)}
  .rtitle{font-size:20px;font-weight:800;letter-spacing:.5px}
  .rsub{color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.5}
  .rsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;break-inside:avoid}
  .rsec h2{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:800}
  .rsec h3{margin:14px 0 6px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut2);font-weight:800}
  .podium{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.podium{grid-template-columns:repeat(4,1fr)}}
  .pod{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg2);border-top:3px solid var(--pc);text-align:center}
  .pod.first{background:rgba(245,197,66,.08);border-color:rgba(245,197,66,.5);border-top-color:var(--pc)}
  .pod .pm{font-size:22px}
  .pod .pn{font-weight:800;font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pod .pv{font-size:20px;margin-top:4px}
  .pod .ps{font-size:11px;color:var(--mut2);margin-top:3px}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2)}
  .kpi .kt{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .kpi .kv{font-size:20px;font-weight:800;color:var(--gold);margin:2px 0}
  .kpi .ks{font-size:11.5px;color:var(--mut2);line-height:1.4}
  svg.chart{width:100%;height:auto;display:block}
  svg.chart .grid{stroke:var(--line);stroke-width:1}
  svg.chart .zero{stroke:var(--mut2);stroke-width:1.5;stroke-dasharray:4 4}
  svg.chart .ax{fill:var(--mut);font-size:11px;font-family:inherit}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:12.5px;color:var(--mut)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .bars .bar{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px}
  .bars .bl{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;color:var(--mut)}
  .bars .bt{flex:1;height:14px;background:var(--bg2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .bars .bt i{display:block;height:100%;border-radius:7px}
  .bars .bv{flex:0 0 64px;font-weight:700;font-size:12.5px}
  .tblwrap{overflow-x:auto;margin-top:6px;border-radius:12px;border:1px solid var(--line)}
  table.mx{border-collapse:collapse;width:100%;background:var(--bg2);font-size:13px}
  table.mx th,table.mx td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.mx th{background:var(--card2);font-size:11.5px;color:var(--mut);font-weight:700}
  table.mx tbody th{text-align:left;color:var(--ink)}
  table.mx .corner{text-align:left;font-weight:600;color:var(--mut2)}
  table.mx td.sum{font-weight:800}
  table.mx.small{font-size:12px} table.mx.small th,table.mx.small td{padding:5px 6px}
  .wl{color:var(--mut2);font-size:11px}
  .facts{margin:0;padding-left:18px;line-height:1.7;font-size:13.5px}

  @media print{
    :root{--bg:#fff;--bg2:#fff;--card:#fff;--card2:#f2f4f7;--line:#cfd5df;--ink:#111;--mut:#555;--mut2:#777;--acc:#1e9e63;--acc2:#1e9e63;--gold:#a4780a;--red2:#c62828;--blue:#1565c0}
    body{background:#fff;padding:0;color:#111}
    header,.foot,.noprint{display:none!important}
    .wrap{max-width:none;padding:0}
    .rsec,.rhead,.pod,.kpi{box-shadow:none;break-inside:avoid}
    .rsec{border-color:#cfd5df}
    .pos{color:#1e9e63!important}.neg{color:#c62828!important}
    table.mx td[style*="rgba(226"]{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .bars .bt i,.pod,.kpi,.legend i,svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{margin:14mm}
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .box,.sheet{animation:pop .22s ease both}
</style>
</head>
<body>
<header>
  <h1>SCHAF<span class="hl">KOPF</span></h1>
  <div class="sub" id="subline">Zähltafel & Spielwerte</div>
</header>
<div class="wrap" id="app"></div>
<div class="foot">Läuft offline · Spielstand wird lokal gespeichert</div>

<script>
"use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const KEY="schafkopf.v1";
const GAMES=[
  {id:"sauspiel", name:"Sauspiel",  short:"Sau",    kind:"pair",  def:10, always:true},
  {id:"solo",     name:"Solo",      short:"Solo",   kind:"solo",  def:20, always:true},
  {id:"wenz",     name:"Wenz",      short:"Wenz",   kind:"solo",  def:20, lauf4:true},
  {id:"geier",    name:"Geier",     short:"Geier",  kind:"solo",  def:20, lauf4:true},
  {id:"goass",    name:"Goaß",      short:"Goaß",   kind:"goass", def:10},
  {id:"hochzeit", name:"Hochzeit",  short:"Hochz.", kind:"pair",  def:40},
  {id:"farbwenz", name:"Farbwenz",  short:"F-Wenz", kind:"solo",  def:20, lauf4:true},
  {id:"farbgeier",name:"Farbgeier", short:"F-Geier",kind:"solo",  def:20, lauf4:true},
  {id:"ramsch",   name:"Ramsch",    short:"Ramsch", kind:"ramsch",def:10}
];
const ZAMG={id:"zamg",name:"Zamgschmissen",short:"Zamg",kind:"zamg"};
const gameById=id=>id==="zamg"?ZAMG:GAMES.find(g=>g.id===id);
const eur=c=>{const s=c<0?"−":"";const a=Math.abs(c);return s+(a/100).toFixed(2).replace(".",",")+" €";};
const sgn=c=>c>0?"+"+eur(c):(c<0?eur(c):"±0");

/* ---------- State ---------- */
let G=null;      // {setup:{...}, rounds:[...]}
let SETUP=null;  // Setup-Formular
let CUR=null;    // aktuelle Rundeneingabe
let EDIT=null;   // Index der bearbeiteten Runde
let ARCH=[];     // abgeschlossene Spielabende
let VIEW=null;   // Index eines Archiv-Berichts, der gerade angezeigt wird
const KEY_ARCH="schafkopf.archive.v1";
function load(){
  try{const s=localStorage.getItem(KEY); if(s){const o=JSON.parse(s); G=o.G||null; SETUP=o.SETUP||null; CUR=o.CUR||null;}}catch(e){}
  try{const a=localStorage.getItem(KEY_ARCH); if(a) ARCH=JSON.parse(a)||[];}catch(e){}
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({G,SETUP,CUR})); localStorage.setItem(KEY_ARCH,JSON.stringify(ARCH)); }catch(e){} }
load();
const PCOL=["#4aa8ff","#f5a623","#3ecf8e","#ff5a4d"];
const fmtDate=iso=>{ try{ return new Date(iso).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}); }catch(e){ return ""; } };

function defaultSetup(){
  const vals={}; GAMES.forEach(g=>vals[g.id]=g.def); vals.zamg=10;
  return {deck:"kurz",names:["","","",""],start:[0,0,0,0],games:["sauspiel","solo"],tout:true,stockRule:"none",laufMin:2,vals};
}

/* ---------- Setup (Teil 1) ---------- */
function renderSetup(){
  const S=SETUP;
  let h=`<div class="box"><div class="sectionTitle first">Karte</div>
    <div class="seg"><button data-deck="lang" class="${S.deck==="lang"?"on":""}">Langer (Laufende bis 14)</button><button data-deck="kurz" class="${S.deck==="kurz"?"on":""}">Kurzer (bis 12)</button></div>
    <div class="sectionTitle">Spieler (Sitzreihenfolge) & Startgeld optional</div>`;
  for(let i=0;i<4;i++){
    h+=`<div class="prow"><div class="idx">${"ABCD"[i]}</div>
      <input class="nm" type="text" maxlength="12" placeholder="Spieler ${"ABCD"[i]}" value="${esc(S.names[i])}" data-nm="${i}">
      <input class="st" type="number" step="0.5" min="0" placeholder="€ Start" value="${S.start[i]?(S.start[i]/100):""}" data-st="${i}"></div>`;
  }
  h+=`<div class="sectionTitle">Erlaubte Spiele</div><div class="chips">`;
  GAMES.forEach(g=>h+=`<div class="chip ${S.games.includes(g.id)?"on":""}" data-g="${g.id}">${g.name}</div>`);
  h+=`</div>
    <div class="sectionTitle">Zusatzoptionen</div>
    <div class="chips" style="margin-bottom:4px"><div class="chip ${S.tout?"on":""}" id="cTout">Tout</div></div>
    <div class="hint" style="margin:0 0 10px">Tout gibt es nur bei Solo, Wenz, Geier, Farbwenz und Farbgeier – und pro Spiel nur einmal.</div>
    <label class="fld">Zamgschmissen / Stock</label>
    <div class="chips radio">
      <div class="chip ${S.stockRule==="none"?"on":""}" data-sr="none">Stock (nur sammeln)</div>
      <div class="chip ${S.stockRule==="sau"?"on":""}" data-sr="sau">Stock bei Sauspiel</div>
      <div class="chip ${S.stockRule==="solo"?"on":""}" data-sr="solo">Stock bei Solo</div>
      <div class="chip ${S.stockRule==="auf"?"on":""}" data-sr="auf">Aufdoppeln (kein Stock)</div>
    </div>
    <div class="hint">${
      S.stockRule==="none"?"Zamgschmissen: jeder legt in den Stock. Der Stock wird nicht ausgespielt (Verteilung am Ende nach Belieben).":
      S.stockRule==="sau"?"Zamgschmissen: jeder legt in den Stock. Gewinnt die Sauspiel-/Hochzeits-Partei, bekommt jeder der beiden eine Hälfte; verliert sie, legt jeder eine Hälfte nach (Stock verdoppelt sich).":
      S.stockRule==="solo"?"Zamgschmissen: jeder legt in den Stock. Gewinnt der Solospieler (Solo/Wenz/Geier/Farbwenz/Farbgeier), bekommt er den ganzen Stock; verliert er, legt er den Betrag nach (Stock verdoppelt sich).":
      "Kein Stock: Nach jedem Zamgschmissen zählt das jeweils nächste Spiel automatisch doppelt (mehrere Zamgschmissen = mehrere doppelte Spiele)."}</div>
    <label class="fld" style="margin-top:12px">Laufende zählen ab</label>
    <div class="seg" style="max-width:260px"><button data-lm="2" class="${S.laufMin===2?"on":""}">ab 2</button><button data-lm="3" class="${S.laufMin===3?"on":""}">ab 3</button></div>
    <div class="sectionTitle">Spielwerte (Cent)</div>`;
  GAMES.filter(g=>S.games.includes(g.id)).forEach(g=>{
    h+=`<div class="vrow"><span class="nm">${g.name}</span><input type="number" min="0" step="5" value="${S.vals[g.id]}" data-val="${g.id}"><span class="unit">ct</span></div>`;
  });
  if(S.stockRule!=="auf") h+=`<div class="vrow"><span class="nm">Zamgschmissen (Einlage je Spieler)</span><input type="number" min="0" step="5" value="${S.vals.zamg}" data-val="zamg"><span class="unit">ct</span></div>`;
  h+=`<button class="act" id="btnStart">Zähltafel starten 🃏</button>
    ${G?`<button class="act sec" id="btnBack">← Zurück zur laufenden Tafel</button>`:""}</div>`;
  return h;
}
function bindSetup(){
  const S=SETUP;
  document.querySelectorAll("[data-deck]").forEach(b=>b.onclick=()=>{S.deck=b.dataset.deck;save();render();});
  document.querySelectorAll("[data-nm]").forEach(i=>i.oninput=()=>{S.names[+i.dataset.nm]=i.value;save();});
  document.querySelectorAll("[data-st]").forEach(i=>i.oninput=()=>{S.start[+i.dataset.st]=Math.round((parseFloat(i.value)||0)*100);save();});
  document.querySelectorAll("[data-g]").forEach(c=>c.onclick=()=>{
    const id=c.dataset.g; const k=S.games.indexOf(id);
    if(k>=0) S.games.splice(k,1); else S.games.push(id);
    save(); render();
  });
  document.getElementById("cTout").onclick=()=>{S.tout=!S.tout;save();render();};
  document.querySelectorAll("[data-sr]").forEach(c=>c.onclick=()=>{S.stockRule=c.dataset.sr;save();render();});
  document.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>{S.laufMin=+b.dataset.lm;save();render();});
  document.querySelectorAll("[data-val]").forEach(i=>i.oninput=()=>{S.vals[i.dataset.val]=parseInt(i.value,10)||0;save();});
  document.getElementById("btnStart").onclick=()=>{
    if(S.games.length===0){alert("Bitte mindestens ein Spiel erlauben.");return;}
    if(G && G.rounds.length && !confirm("Laufende Tafel verwerfen und neu starten?")) return;
    const setup=JSON.parse(JSON.stringify(S));
    setup.names=setup.names.map((n,i)=>n.trim()||("Spieler "+"ABCD"[i]));
    G={setup,rounds:[],startedAt:new Date().toISOString()}; CUR=null; EDIT=null; SETUP=null; save(); render();
  };
  const bb=document.getElementById("btnBack"); if(bb) bb.onclick=()=>{SETUP=null;save();render();};
}

/* ---------- Abrechnung (Replay) ---------- */
function laufMax(gid){ const g=gameById(gid); if(g&&g.lauf4) return 4; return G.setup.deck==="lang"?14:12; }
function computeAll(game){
  const GG=game||G; const S=GG.setup, n=4;
  let totals=S.start.slice(), stock=0, pending=0, goassLeft=0;
  const out=[];
  GG.rounds.forEach((r,idx)=>{
    const res={delta:[0,0,0,0],value:0,stockAfter:0,calc:"",forcedGoass:goassLeft>0,doubledByPending:false,stockMove:0};
    const D=r.d.filter(Boolean).length, K=r.k.reduce((a,b)=>a+b,0);
    if(r.type==="zamg"){
      if(S.stockRule==="auf"){ pending++; res.calc="Nächstes Spiel zählt doppelt"; }
      else{
        const each=S.vals.zamg*Math.pow(2,D);
        for(let p=0;p<n;p++){res.delta[p]-=each;}
        stock+=each*n; res.calc=`${eur(each)} je Spieler in den Stock${D?" (×"+Math.pow(2,D)+" Doppler)":""}`;
      }
    } else {
      const g=gameById(r.type);
      let v=S.vals[r.type]||0; const parts=[`${g.name} ${v}`];
      if(g.kind!=="ramsch"){
        if(r.schneider){v+=10;parts.push("+10 Schneider");}
        if(r.schwarz){v+=10;parts.push("+10 Schwarz");}
        if(r.lauf){v+=r.lauf*10;parts.push(`+${r.lauf*10} (${r.lauf} Laufende)`);}
      }
      if(D){v*=Math.pow(2,D);parts.push(`×${Math.pow(2,D)} Doppler`);}
      if(K){v*=Math.pow(2,K);parts.push(`×${Math.pow(2,K)} Kontra`);}
      if(r.tout&&g.kind==="solo"){v*=2;parts.push("×2 Tout");}
      if(pending>0){v*=2;pending--;parts.push("×2 Aufdoppeln");res.doubledByPending=true;}
      res.value=v; res.calc=parts.join(" ");
      const d=res.delta;
      if(g.kind==="solo"){
        const p=r.players[0]; const win=r.win;
        for(let q=0;q<n;q++){ if(q===p) d[q]+= win?3*v:-3*v; else d[q]+= win?-v:v; }
        if(S.stockRule==="solo" && stock>0){
          if(win){ d[p]+=stock; res.stockMove=-stock; stock=0; }
          else { d[p]-=stock; res.stockMove=stock; stock*=2; }
        }
      } else if(g.kind==="pair"){
        const [a,b]=r.players; const win=r.win;
        for(let q=0;q<n;q++){ const inP=(q===a||q===b); d[q]+= (inP===win)? v : -v; }
        if(S.stockRule==="sau" && stock>0){
          const half=Math.round(stock/2);
          if(win){ d[a]+=half; d[b]+=stock-half; res.stockMove=-stock; stock=0; }
          else { d[a]-=half; d[b]-=stock-half; res.stockMove=stock; stock*=2; }
        }
      } else if(g.kind==="goass"){
        const team=r.team; // "AC" oder "BD" = Gewinner
        for(let q=0;q<n;q++){ const inAC=(q===0||q===2); const won=(team==="AC")===inAC; d[q]+= won?v:-v; }
        if(!res.forcedGoass) goassLeft=3; else goassLeft--;
      } else if(g.kind==="ramsch"){
        const p=r.players[0];
        if(r.durchmarsch){ for(let q=0;q<n;q++) d[q]+= q===p?3*v:-v; }
        else { for(let q=0;q<n;q++) d[q]+= q===p?-3*v:v; }
      }
    }
    if(r.type!=="goass" && goassLeft>0) goassLeft--; // Sicherheitsnetz (sollte nicht vorkommen)
    for(let p=0;p<n;p++) totals[p]+=res.delta[p];
    res.stockAfter=stock; res.totals=totals.slice();
    out.push(res);
  });
  return {rows:out,totals,stock,pending,goassLeft};
}

/* ---------- Rundeneingabe ---------- */
function newCur(){
  const st=computeAll();
  const allowed=allowedTypes(st);
  return {type:allowed[0],players:[],team:"AC",win:true,schneider:false,schwarz:false,lauf:0,tout:false,durchmarsch:false,d:[false,false,false,false],k:[0,0,0,0]};
}
function allowedTypes(st){
  if(st.goassLeft>0) return ["goass"];
  const t=GAMES.filter(g=>G.setup.games.includes(g.id)).map(g=>g.id);
  t.push("zamg"); return t;
}
function curValid(c){
  const g=gameById(c.type);
  if(g.kind==="solo"||g.kind==="ramsch") return c.players.length===1;
  if(g.kind==="pair") return c.players.length===2;
  return true;
}
function previewCur(c){
  // Simulation: Runde temporär anhängen
  const backup=G.rounds; G.rounds=EDIT!=null?backup.map((r,i)=>i===EDIT?c:r):backup.concat([c]);
  const st=computeAll(); G.rounds=backup;
  return st.rows[EDIT!=null?EDIT:st.rows.length-1];
}

function bindGame(){

  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{c.d[+b.dataset.d]=!c.d[+b.dataset.d];rr();});
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{c.k[+b.dataset.k]++;rr();});
  document.querySelectorAll("[data-km]").forEach(b=>b.onclick=()=>{const p=+b.dataset.km; if(c.k[p]>0)c.k[p]--; rr();});
  document.getElementById("selType").onchange=e=>{
    c.type=e.target.value; c.players=[]; const g=gameById(c.type);
    if(g.kind==="ramsch"||g.kind==="zamg"){c.schneider=c.schwarz=c.tout=false;c.lauf=0;}
    if(g.kind!=="solo") c.tout=false;
    if(c.lauf){const mx=laufMax(c.type); if(c.lauf>mx)c.lauf=mx;}
    rr();
  };
  document.querySelectorAll("[data-pl]").forEach(ch=>ch.onclick=()=>{
    const p=+ch.dataset.pl, g=gameById(c.type), need=g.kind==="pair"?2:1;
    const k=c.players.indexOf(p);
    if(k>=0) c.players.splice(k,1); else if(c.players.length<need) c.players.push(p);
    else if(need===1) c.players=[p];
    rr();
  });
  document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{c.team=b.dataset.team;rr();});
  document.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>{c.win=b.dataset.win==="1";rr();});
  const q=id=>document.getElementById(id);
  if(q("cDurch")) q("cDurch").onclick=()=>{c.durchmarsch=!c.durchmarsch;rr();};
  if(q("cSchn")) q("cSchn").onclick=()=>{c.schneider=!c.schneider; if(!c.schneider){c.schwarz=false;c.tout=false;} rr();};
  if(q("cSchw")) q("cSchw").onclick=()=>{c.schwarz=!c.schwarz; if(c.schwarz)c.schneider=true; else c.tout=false; rr();};
  if(q("cTout")) q("cTout").onclick=()=>{c.tout=!c.tout; if(c.tout){c.schneider=true;c.schwarz=true;} rr();};
  if(q("cLauf")) q("cLauf").onclick=()=>{c.lauf=c.lauf?0:G.setup.laufMin;rr();};
  if(q("selLauf")) q("selLauf").onchange=e=>{c.lauf=+e.target.value;rr();};
  q("btnCommit").onclick=()=>{
    const r=JSON.parse(JSON.stringify(c));
    if(EDIT!=null){ G.rounds[EDIT]=r; EDIT=null; }
    else G.rounds.push(r);
    CUR=null; save(); render();
    const sc=document.getElementById("scroller"); if(sc) sc.scrollTop=sc.scrollHeight;
  };
  if(q("btnCancelEdit")) q("btnCancelEdit").onclick=()=>{EDIT=null;CUR=null;rr();};
  if(q("btnDelete")) q("btnDelete").onclick=()=>{ if(confirm("Dieses Spiel wirklich löschen?")){G.rounds.splice(EDIT,1);EDIT=null;CUR=null;rr();} };
  if(q("btnUndo")) q("btnUndo").onclick=()=>{ if(confirm("Letztes Spiel löschen?")){G.rounds.pop();CUR=null;rr();} };
  q("btnSetup").onclick=()=>{ SETUP=JSON.parse(JSON.stringify(G.setup)); rr(); };
  if(q("btnFinish")) q("btnFinish").onclick=()=>{
    if(!confirm("Spielabend beenden und Endabrechnung anzeigen? (Du kannst danach noch zurück.)")) return;
    G.finished=true; G.endedAt=new Date().toISOString(); if(!G.startedAt) G.startedAt=G.endedAt; CUR=null; rr();
    window.scrollTo({top:0});
  };
  document.querySelectorAll("[data-edit]").forEach(tr=>tr.onclick=()=>{
    const i=+tr.dataset.edit; EDIT=i; CUR=JSON.parse(JSON.stringify(G.rounds[i])); rr();
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  });
}

/* ================= ANALYSE & BERICHT ================= */
function analyze(game){
  const S=game.setup, names=S.names, st=computeAll(game), rows=st.rows, R=game.rounds, n=4;
  // Verlauf (Index 0 = Start)
  const series=names.map((_,p)=>[S.start[p]].concat(rows.map(r=>r.totals[p])));
  // Geldflüsse: 5 Knoten (4 Spieler + Stock)
  const flow=Array.from({length:5},()=>[0,0,0,0,0]);
  rows.forEach(res=>{
    const d=res.delta.slice();
    const payers=[],recv=[];
    d.forEach((v,p)=>{ if(v<0)payers.push([p,-v]); else if(v>0)recv.push([p,v]); });
    let totPay=payers.reduce((a,b)=>a+b[1],0), totRec=recv.reduce((a,b)=>a+b[1],0);
    if(totPay>totRec) recv.push([4,totPay-totRec]);          // Rest geht in den Stock
    else if(totRec>totPay) payers.push([4,totRec-totPay]);   // Stock zahlt aus
    totRec=recv.reduce((a,b)=>a+b[1],0);
    if(!totRec) return;
    payers.forEach(([p,amt])=>recv.forEach(([q,w])=>{ flow[p][q]+=Math.round(amt*w/totRec); }));
  });
  // Spielstatistik
  const typeStats={}; const perPlayer=names.map(()=>({played:{},won:{},d:0,k:0,ramschLost:0,zamg:0,bestGain:0,worstLoss:0,gain:0,loss:0}));
  let maxVal={v:0,idx:-1}, maxGain={v:0,idx:-1,p:-1}, maxLoss={v:0,idx:-1,p:-1}, turnover=0, zamgCount=0;
  rows.forEach((res,i)=>{
    const r=R[i], g=gameById(r.type);
    turnover+=res.delta.filter(v=>v>0).reduce((a,b)=>a+b,0);
    r.d.forEach((x,p)=>{ if(x)perPlayer[p].d++; }); r.k.forEach((x,p)=>{ perPlayer[p].k+=x; });
    res.delta.forEach((v,p)=>{ if(v>0){perPlayer[p].gain+=v; if(v>perPlayer[p].bestGain)perPlayer[p].bestGain=v;} if(v<0){perPlayer[p].loss+=-v; if(-v>perPlayer[p].worstLoss)perPlayer[p].worstLoss=-v;}
      if(v>maxGain.v)maxGain={v,idx:i,p}; if(-v>maxLoss.v)maxLoss={v:-v,idx:i,p}; });
    if(r.type==="zamg"){ zamgCount++; return; }
    const ts=typeStats[r.type]=typeStats[r.type]||{n:0,won:0,sum:0,max:0};
    ts.n++; ts.sum+=res.value; if(res.value>ts.max)ts.max=res.value;
    if(res.value>maxVal.v) maxVal={v:res.value,idx:i};
    let players=[], won=false;
    if(g.kind==="goass"){ players = r.team==="AC"?[0,2]:[1,3]; won=true; }
    else if(g.kind==="ramsch"){ players=[r.players[0]]; won=!!r.durchmarsch; if(!won)perPlayer[r.players[0]].ramschLost++; }
    else { players=r.players; won=!!r.win; }
    if(won) ts.won++;
    players.forEach(p=>{ const pp=perPlayer[p]; pp.played[r.type]=(pp.played[r.type]||0)+1; if(won)pp.won[r.type]=(pp.won[r.type]||0)+1; });
  });
  const totals=st.totals, net=totals.map((t,p)=>t-S.start[p]);
  return {S,names,st,rows,series,flow,typeStats,perPlayer,maxVal,maxGain,maxLoss,turnover,zamgCount,totals,net};
}

/* --- SVG-Charts (ohne Bibliotheken) --- */
function svgLine(series,names,startLabel){
  const W=680,H=280,L=56,Rr=16,T=18,B=34;
  const all=series.flat(); let mn=Math.min(...all,0), mx=Math.max(...all,0); if(mx===mn){mx+=100;mn-=100;}
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const N=series[0].length; const x=i=>L+(N===1?0:(W-L-Rr)*i/(N-1)); const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Geldverlauf">`;
  // Gitter
  const steps=5; for(let k=0;k<=steps;k++){ const v=mn+(mx-mn)*k/steps; s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${(v/100).toFixed(2).replace(".",",")}</text>`; }
  if(mn<0&&mx>0) s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}" class="zero"/>`;
  const xt=Math.max(1,Math.ceil(N/12)); for(let i=0;i<N;i+=xt){ s+=`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" class="ax">${i===0?startLabel:i}</text>`; }
  s+=`<text x="${(L+W-Rr)/2}" y="${H-4}" text-anchor="middle" class="ax">Spiel Nr.</text>`;
  series.forEach((ser,p)=>{
    const pts=ser.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${PCOL[p]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lv=ser[ser.length-1]; s+=`<circle cx="${x(N-1)}" cy="${y(lv)}" r="4" fill="${PCOL[p]}"/>`;
  });
  s+=`</svg><div class="legend">${names.map((nm,p)=>`<span><i style="background:${PCOL[p]}"></i>${esc(nm)}</span>`).join("")}</div>`;
  return s;
}
function svgBars(items,valueFmt){
  const mx=Math.max(...items.map(i=>i.v),1);
  return `<div class="bars">${items.map(i=>`<div class="bar"><span class="bl">${esc(i.label)}</span><span class="bt"><i style="width:${(i.v/mx*100).toFixed(1)}%;background:${i.color||"var(--acc)"}"></i></span><span class="bv">${valueFmt?valueFmt(i.v):i.v}</span></div>`).join("")}</div>`;
}

function renderReport(game,opts){
  const A=analyze(game), {S,names,rows,perPlayer,typeStats}=A, R=game.rounds;
  const archived=opts&&opts.archived;
  const order=[0,1,2,3].sort((a,b)=>A.net[b]-A.net[a]);
  const medals=["🥇","🥈","🥉","4."];
  const played=R.length, real=R.filter(r=>r.type!=="zamg").length;
  const dur=(()=>{ if(!game.startedAt||!game.endedAt)return ""; const m=Math.round((new Date(game.endedAt)-new Date(game.startedAt))/60000); return m>0?` · ${Math.floor(m/60)}h ${m%60}min`:""; })();
  const roundLabel=i=>{ const r=R[i]; if(!r)return "–"; const g=gameById(r.type); if(r.type==="zamg")return "Zamgschmissen";
    const who=g.kind==="goass"?(r.team==="AC"?names[0]+"+"+names[2]:names[1]+"+"+names[3]):r.players.map(p=>names[p]).join("+");
    return `${g.name} · ${who}${g.kind==="ramsch"?(r.durchmarsch?" (Durchmarsch)":" verliert"):(g.kind==="goass"?" ✓":(r.win?" ✓":" ✗"))}`; };

  let h=`<div class="report" id="report">
    <div class="noprint row" style="margin:12px 0 4px">
      <button class="mini" id="btnPrint" style="flex:1;border-color:var(--gold);color:var(--gold)">🖨️ Als PDF speichern / drucken</button>
      ${archived?`<button class="mini" id="btnArchBack" style="flex:1">← Zurück</button>`:`<button class="mini" id="btnReopen" style="flex:1">↩ Weiterspielen</button>`}
    </div>
    <div class="rhead"><div><div class="rtitle">Schafkopf-Abend · Endabrechnung</div>
      <div class="rsub">${fmtDate(game.endedAt||game.startedAt)}${dur} · ${played} Spiele${A.zamgCount?` (davon ${A.zamgCount}× zamgschmissen)`:""} · ${S.deck==="lang"?"Langer":"Kurzer"} · Laufende ab ${S.laufMin} · ${S.stockRule==="auf"?"Aufdoppeln":"Stock"+(S.stockRule==="sau"?" bei Sauspiel":S.stockRule==="solo"?" bei Solo":"")}</div></div></div>

    <div class="rsec"><h2>Endstand</h2><div class="podium">`;
  order.forEach((p,i)=>{
    h+=`<div class="pod ${i===0?"first":""}" style="--pc:${PCOL[p]}"><div class="pm">${medals[i]}</div><div class="pn">${esc(names[p])}</div>
      <div class="pv ${A.net[p]>0?"pos":A.net[p]<0?"neg":"zero"}">${sgn(A.net[p])}</div>
      <div class="ps">Stand ${eur(A.totals[p])}${S.start[p]?` · Start ${eur(S.start[p])}`:""}</div></div>`;
  });
  h+=`</div>${A.st.stock?`<div class="hint">Im Stock verblieben: <b style="color:var(--gold)">${eur(A.st.stock)}</b>${S.stockRule==="sau"?" (2 Hälften)":""} – nach Belieben aufteilen.</div>`:""}</div>`;

  // Kennzahlen
  const kp=[];
  if(A.maxVal.idx>=0) kp.push({t:"Teuerstes Spiel",v:eur(A.maxVal.v),s:`Spiel ${A.maxVal.idx+1}: ${roundLabel(A.maxVal.idx)} – ${rows[A.maxVal.idx].calc}`});
  if(A.maxGain.idx>=0) kp.push({t:"Größter Einzelgewinn",v:sgn(A.maxGain.v),s:`${names[A.maxGain.p]} in Spiel ${A.maxGain.idx+1} (${roundLabel(A.maxGain.idx)})`});
  if(A.maxLoss.idx>=0) kp.push({t:"Größter Einzelverlust",v:"−"+eur(A.maxLoss.v),s:`${names[A.maxLoss.p]} in Spiel ${A.maxLoss.idx+1} (${roundLabel(A.maxLoss.idx)})`});
  kp.push({t:"Umsatz gesamt",v:eur(A.turnover),s:`Ø ${eur(Math.round(A.turnover/Math.max(1,played)))} pro Spiel`});
  h+=`<div class="rsec"><h2>Kennzahlen</h2><div class="kpis">${kp.map(k=>`<div class="kpi"><div class="kt">${esc(k.t)}</div><div class="kv">${esc(k.v)}</div><div class="ks">${esc(k.s)}</div></div>`).join("")}</div></div>`;

  // Geldverlauf
  h+=`<div class="rsec"><h2>Geldverlauf über den Abend</h2>${svgLine(A.series,names,"Start")}</div>`;

  // Geldflüsse
  const labels=names.concat(["Stock"]);
  const anyStock=A.flow.some((r,i)=>r[4]>0)||A.flow[4].some(v=>v>0);
  const idx=anyStock?[0,1,2,3,4]:[0,1,2,3];
  h+=`<div class="rsec"><h2>Geldflüsse – wer hat an wen gezahlt?</h2><div class="tblwrap"><table class="mx"><thead><tr><th class="corner">von ↓ &nbsp;an →</th>${idx.map(j=>`<th>${esc(labels[j])}</th>`).join("")}<th>gezahlt</th></tr></thead><tbody>`;
  const mxFlow=Math.max(1,...A.flow.flat());
  idx.forEach(i=>{
    const rowSum=idx.reduce((a,j)=>a+A.flow[i][j],0);
    h+=`<tr><th>${esc(labels[i])}</th>${idx.map(j=>{ const v=A.flow[i][j]; const al=v?0.12+0.55*v/mxFlow:0; return `<td style="background:rgba(226,59,59,${al.toFixed(2)})">${v?eur(v).replace(" €",""):"·"}</td>`; }).join("")}<td class="sum neg">${rowSum?eur(rowSum).replace(" €",""):"·"}</td></tr>`;
  });
  h+=`<tr><th>erhalten</th>${idx.map(j=>{ const c=idx.reduce((a,i)=>a+A.flow[i][j],0); return `<td class="sum pos">${c?eur(c).replace(" €",""):"·"}</td>`; }).join("")}<td></td></tr></tbody></table></div>`;
  // Top-Flüsse
  const pairs=[]; idx.forEach(i=>idx.forEach(j=>{ if(i!==j&&A.flow[i][j]>0) pairs.push({label:`${labels[i]} → ${labels[j]}`,v:A.flow[i][j],color:i<4?PCOL[i]:"var(--gold)"}); }));
  pairs.sort((a,b)=>b.v-a.v);
  if(pairs.length) h+=`<h3>Stärkste Geldströme</h3>${svgBars(pairs.slice(0,6),eur)}`;
  h+=`<div class="hint">Bei Partnerspielen werden Zahlungen anteilig auf die Gewinner verteilt.</div></div>`;

  // Spieltypen
  const tkeys=Object.keys(typeStats).sort((a,b)=>typeStats[b].n-typeStats[a].n);
  if(tkeys.length){
    h+=`<div class="rsec"><h2>Spiele nach Typ</h2>${svgBars(tkeys.map(t=>({label:gameById(t).name,v:typeStats[t].n})),v=>v+"×")}
      <div class="tblwrap"><table class="mx small"><thead><tr><th>Spiel</th><th>Anzahl</th><th>gewonnen</th><th>Quote</th><th>Ø Wert</th><th>max. Wert</th></tr></thead><tbody>`;
    tkeys.forEach(t=>{ const s=typeStats[t]; h+=`<tr><th>${esc(gameById(t).name)}</th><td>${s.n}</td><td>${s.won}</td><td>${Math.round(100*s.won/s.n)} %</td><td>${eur(Math.round(s.sum/s.n))}</td><td>${eur(s.max)}</td></tr>`; });
    h+=`</tbody></table></div><div class="hint">„gewonnen“ = die spielende Partei hat gewonnen (bei Ramsch: Durchmarsch).</div></div>`;
  }

  // Spieler-Statistik
  const allTypes=GAMES.filter(g=>perPlayer.some(pp=>pp.played[g.id])).map(g=>g.id);
  h+=`<div class="rsec"><h2>Wer hat was gespielt?</h2><div class="tblwrap"><table class="mx small"><thead><tr><th>Spieler</th>${allTypes.map(t=>`<th>${esc(gameById(t).short)}</th>`).join("")}<th>Σ</th><th>Siege</th><th>D</th><th>K</th></tr></thead><tbody>`;
  names.forEach((nm,p)=>{
    const pp=perPlayer[p]; const tot=Object.values(pp.played).reduce((a,b)=>a+b,0), won=Object.values(pp.won).reduce((a,b)=>a+b,0);
    h+=`<tr><th style="color:${PCOL[p]}">${esc(nm)}</th>${allTypes.map(t=>`<td>${pp.played[t]?`${pp.played[t]} <span class="wl">(${pp.won[t]||0}✓)</span>`:"·"}</td>`).join("")}<td><b>${tot}</b></td><td>${tot?Math.round(100*won/tot)+" %":"·"}</td><td>${pp.d||"·"}</td><td>${pp.k||"·"}</td></tr>`;
  });
  h+=`</tbody></table></div><div class="hint">Zahl = gespielt, in Klammern gewonnen. D = Doppler gedrückt, K = Kontra-Klicks.</div></div>`;

  // Fun Facts
  const facts=[];
  const top=(fn,label,fmt)=>{ let best=-1,bp=-1; names.forEach((_,p)=>{const v=fn(perPlayer[p],p); if(v>best){best=v;bp=p;}}); if(best>0) facts.push(`<b>${esc(label)}:</b> ${esc(names[bp])} (${fmt?fmt(best):best})`); };
  top(pp=>Object.values(pp.played).reduce((a,b)=>a+b,0),"Vielspieler",v=>v+" Spiele");
  top(pp=>pp.d,"Dauer-Doppler",v=>v+"× D");
  top(pp=>pp.k,"Kontra-König",v=>v+"× Kontra");
  top(pp=>pp.ramschLost,"Ramsch-Pechvogel",v=>v+"× verloren");
  top(pp=>{const s=["solo","wenz","geier","farbwenz","farbgeier"];return s.reduce((a,t)=>a+(pp.won[t]||0),0);},"Solo-Spezialist",v=>v+" Solos gewonnen");
  top(pp=>pp.gain,"Meiste Einnahmen",eur);
  top(pp=>pp.loss,"Meiste Ausgaben",eur);
  // längste Gewinnserie
  let bestStreak=0,bsp=-1; names.forEach((_,p)=>{let cur=0,mxs=0; rows.forEach(r=>{ if(r.delta[p]>0){cur++;mxs=Math.max(mxs,cur);} else if(r.delta[p]<0)cur=0; }); if(mxs>bestStreak){bestStreak=mxs;bsp=p;}});
  if(bestStreak>1) facts.push(`<b>Längste Gewinnserie:</b> ${esc(names[bsp])} (${bestStreak} Spiele in Folge)`);
  if(facts.length) h+=`<div class="rsec"><h2>Auszeichnungen</h2><ul class="facts">${facts.map(f=>`<li>${f}</li>`).join("")}</ul></div>`;

  // Spielprotokoll
  h+=`<div class="rsec"><h2>Spielprotokoll</h2><div class="tblwrap"><table class="mx small"><thead><tr><th>#</th><th style="text-align:left">Spiel</th>${names.map((nm,p)=>`<th style="color:${PCOL[p]}">${esc(nm)}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach((res,i)=>{ h+=`<tr><td>${i+1}</td><th style="text-align:left;font-weight:600">${esc(roundLabel(i))}${res.value?` <span class="wl">${res.value}</span>`:""}</th>${res.delta.map(v=>`<td class="${v>0?"pos":v<0?"neg":"zero"}">${v?sgn(v).replace(" €",""):"·"}</td>`).join("")}</tr>`; });
  h+=`</tbody></table></div></div>`;

  if(!archived) h+=`<div class="noprint"><button class="act" id="btnArchive">✅ Abend abschließen & im Archiv ablegen</button><div class="hint">Der Bericht bleibt im Archiv abrufbar (Setup-Seite). Danach kannst du eine neue Tafel starten.</div></div>`;
  h+=`</div>`;
  return h;
}
function bindReport(archived){
  const q=id=>document.getElementById(id);
  q("btnPrint").onclick=()=>window.print();
  if(q("btnReopen")) q("btnReopen").onclick=()=>{ G.finished=false; save(); render(); };
  if(q("btnArchBack")) q("btnArchBack").onclick=()=>{ VIEW=null; render(); };
  if(q("btnArchive")) q("btnArchive").onclick=()=>{
    ARCH.unshift(JSON.parse(JSON.stringify(G)));
    SETUP=JSON.parse(JSON.stringify(G.setup)); G=null; CUR=null; save(); render();
  };
}
function renderArchiveList(){
  if(!ARCH.length) return "";
  let h=`<div class="box"><div class="sectionTitle first">📚 Archiv – vergangene Spielabende</div>`;
  ARCH.forEach((g,i)=>{
    const A=analyze(g); const w=[0,1,2,3].sort((a,b)=>A.net[b]-A.net[a])[0];
    h+=`<div class="drow"><span class="nm" style="white-space:normal"><b>${fmtDate(g.endedAt||g.startedAt)}</b><br><span style="font-size:12px;color:var(--mut)">${g.rounds.length} Spiele · ${g.setup.names.join(", ")} · Sieger: ${esc(g.setup.names[w])} (${sgn(A.net[w])})</span></span>
      <button class="mini" data-view="${i}">📄</button><button class="mini" data-adel="${i}" style="color:var(--red2)">🗑</button></div>`;
  });
  return h+`</div>`;
}
function bindArchiveList(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{VIEW=+b.dataset.view;render();window.scrollTo({top:0});});
  document.querySelectorAll("[data-adel]").forEach(b=>b.onclick=()=>{ if(confirm("Diesen Spielabend endgültig aus dem Archiv löschen?")){ARCH.splice(+b.dataset.adel,1);save();render();} });
}

/* ---------- Render ---------- */
function render(){
  const app=document.getElementById("app");
  if(VIEW!=null && ARCH[VIEW]){ app.innerHTML=renderReport(ARCH[VIEW],{archived:true}); bindReport(true); return; }
  if(G && G.finished){ app.innerHTML=renderReport(G,{archived:false}); bindReport(false); return; }
  if(SETUP||!G){ if(!SETUP){SETUP=defaultSetup();} app.innerHTML=renderSetup()+renderArchiveList(); bindSetup(); bindArchiveList(); return; }
  const sc0=document.getElementById("scroller"); const keep=sc0?sc0.scrollTop:null;
  app.innerHTML=renderGame(); bindGame();
  const sc=document.getElementById("scroller"); if(sc) sc.scrollTop = keep!=null?keep:sc.scrollHeight;
}
render();
</script>
</body>
